<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Brand - PriceEdge</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0071e3" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="/" class="logo">PriceEdge</a>
      <ul class="nav-links">
        <li><a href="/brands.html">Brands</a></li>
        <li><a href="/group-buys.html">Group Buys</a></li>
        <li><a href="/#pricing">Pricing</a></li>
        <li><a href="/account.html">My Account</a></li>
      </ul>
      <div class="nav-actions">
        <button type="button" class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu"><span></span></button>
        <button type="button" class="install-app-btn" onclick="installApp()">Install App</button>
        <a href="/#pricing" class="cta-button">Join Now</a>
      </div>
    </nav>
  </header>

  <section>
    <div class="container">
      <h2 id="brandHeading">Products</h2>
      <p class="section-subtitle" id="lockedNotice" style="display: none">
        Retail prices are shown below. <a href="/#pricing">Subscribe</a> or
        <a href="/account.html">sign in</a> to see member pricing.
      </p>
      <p class="price-validity-note">Prices shown are reconfirmed with you before payment is taken.</p>
      <div id="productGrid" class="product-grid">
        <p class="empty-state">Loading products…</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">&copy; <span id="year"></span> PriceEdge. All rights reserved.</div>
  </footer>

  <div id="toast" class="toast"><span id="toastMessage"></span></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    async function loadProducts(trackViews = true) {
      const grid = document.getElementById("productGrid");
      const heading = document.getElementById("brandHeading");

      if (!slug) {
        grid.innerHTML = '<p class="empty-state">No brand selected. <a href="/brands.html">Browse brands</a>.</p>';
        return;
      }

      heading.textContent = slug.charAt(0).toUpperCase() + slug.slice(1);
      document.getElementById("pageTitle").textContent = `${heading.textContent} - PriceEdge`;

      const email = getStoredMemberEmail();
      trackEvent("view_brand", { brandSlug: slug, email });
      const url = `/api/brands/${encodeURIComponent(slug)}/products` + (email ? `?email=${encodeURIComponent(email)}` : "");

      try {
        const [config, res] = await Promise.all([getConfig(), fetch(url)]);
        const data = await res.json();

        if (!res.ok) {
          grid.innerHTML = `<p class="empty-state">Couldn't load products: ${data.error || res.statusText}</p>`;
          return;
        }

        if (data.locked) {
          document.getElementById("lockedNotice").style.display = "block";
        }

        if (!data.products || !data.products.length) {
          grid.innerHTML = '<p class="empty-state">No products listed for this brand yet.</p>';
          return;
        }

        grid.innerHTML = data.products
          .map((p) => {
            const lockedHint = p.savingsPercent
              ? `<span class="locked-price">Save ~${p.savingsPercent}% — sign in to see price</span>`
              : `<span class="locked-price">Member price locked</span>`;
            const priceHtml = p.memberPrice
              ? `<span class="retail-price">₦${p.retailPrice.toLocaleString()}</span>
                 <span class="member-price">₦${p.memberPrice.toLocaleString()}</span>`
              : `<span class="retail-price">₦${p.retailPrice.toLocaleString()}</span>
                 ${lockedHint}`;

            const priceLockHtml = p.priceLockExpiresAt
              ? `<div class="price-lock-badge">🔒 Locked until ${p.priceLockExpiresAt}</div>`
              : p.memberPrice
              ? `<button type="button" class="price-lock-btn" onclick="lockPrice('${escapeHtmlAttr(jsStringLiteral(p.id))}', this)">Lock this price for ${config.priceLockDays || 14} days</button>`
              : "";

            return `
              <div class="product-card">
                ${p.imageUrl ? `<img src="${escapeHtmlAttr(p.imageUrl)}" alt="${escapeHtmlAttr(p.name)}" />` : ""}
                <div class="product-body">
                  <h3>${escapeHtmlAttr(p.name)}</h3>
                  <div class="category">${escapeHtmlAttr(p.category || "")}</div>
                  <div class="price-row">${priceHtml}</div>
                  ${priceLockHtml}
                </div>
              </div>`;
          })
          .join("");

        // One event per product card actually shown, tagged locked/unlocked —
        // feeds the group-buy recommendation scoring (see /admin-insights.html).
        // Only on the real page view, not the refresh after locking a price —
        // otherwise every lock action re-logs a "view" for the whole grid.
        if (trackViews) {
          data.products.forEach((p) => {
            trackEvent("view_product", {
              detail: p.id,
              brandSlug: slug,
              provider: p.memberPrice ? "unlocked" : "locked",
              email,
            });
          });
        }
      } catch {
        grid.innerHTML = '<p class="empty-state">Couldn\'t load products. Try again shortly.</p>';
      }
    }

    async function lockPrice(productId, btn) {
      const email = getStoredMemberEmail();
      if (!email) {
        showToast("Sign in with your member email first.");
        return;
      }

      const originalText = btn.textContent;
      btn.textContent = "Locking...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/price-lock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, productId }),
        });
        const data = await res.json();

        if (data.success) {
          trackEvent("lock_price", { email, brandSlug: slug, detail: productId });
          showToast(`Price locked until ${data.expiresAt}.`);
          loadProducts(false);
        } else {
          showToast(data.error || "Couldn't lock this price.");
          btn.textContent = originalText;
          btn.disabled = false;
        }
      } catch {
        showToast("Something went wrong. Try again shortly.");
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    loadProducts();
  </script>
</body>
</html>
